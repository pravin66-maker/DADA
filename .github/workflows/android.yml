name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate project folder
        id: locate
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" -not -path "*/.git/*" | head -n 1)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Found project at: $ROOT_DIR"
          echo "root_dir=$ROOT_DIR" >> "$GITHUB_OUTPUT"

      - name: Point Gradle to the Android SDK
        working-directory: ${{ steps.locate.outputs.root_dir }}
        run: |
          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using SDK at: $SDK_PATH"
          echo "sdk.dir=$SDK_PATH" > local.properties
          cat local.properties

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.root_dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BhajanAlarm-debug-apk
          path: ${{ steps.locate.outputs.root_dir }}/app/build/outputs/apk/debug/app-debug.apk
